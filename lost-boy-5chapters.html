          e.active = true; s.setVisible(true); s.x = Math.max(d.x, P.x - 540); s.play(e.ar); LBAudio.sfx('roar');
        } else return 0;
      }
      if (e.gaveUp) return 0;
      const tx = Phaser.Math.Clamp(P.x, d.min, d.max), dx = tx - s.x;
      if (Math.abs(dx) > 6) { e.dir = Math.sign(dx); s.x += e.dir * d.speed * dt; s.setFlipX(e.dir < 0); }
      if (P.x > d.max + 300) { e.gaveUp = true; s.anims.stop(); s.setFrame(0); }
      let hop = 0;
      (d.leaps || []).forEach(l => { if (s.x > l[0] && s.x < l[1]) hop = Math.sin((s.x - l[0]) / (l[1] - l[0]) * Math.PI) * 90; });
      s.y = e.feet + 4 - hop;
      inten = Math.abs(P.x - s.x) < 700 ? 0.9 : 0.3;
    } else {
      const seen = this.shadowSees(e, 270);
      if (seen && e.state !== 'chase' && !this.dead) { e.state = 'chase'; s.play(e.ar, true); LBAudio.sfx('eyewarn'); }
      if (e.state === 'chase') {
        if (seen) e.memory = 2.6; else e.memory -= dt;
        const dir = Math.sign(P.x - s.x) || e.dir; e.dir = dir;
        s.x = Phaser.Math.Clamp(s.x + dir * (d.speed || 172) * dt, e.x1 - 260, e.x2 + 260);
        if (e.memory <= 0) { e.state = 'patrol'; s.play(e.aw, true); e.dir = s.x > (e.x1 + e.x2) / 2 ? -1 : 1; }
        inten = 0.8;
      } else if (e.state === 'pause') {
        e.timer -= dt; if (e.timer <= 0) { e.state = 'patrol'; s.play(e.aw, true); }
      } else {
        s.x += e.dir * 55 * dt;
        if (e.dir > 0 && s.x >= e.x2) { s.x = e.x2; e.dir = -1; e.state = 'pause'; e.timer = 1.3; s.anims.stop(); s.setFrame(0); }
        else if (e.dir < 0 && s.x <= e.x1) { s.x = e.x1; e.dir = 1; e.state = 'pause'; e.timer = 1.3; s.anims.stop(); s.setFrame(0); }
      }
      s.setFlipX(e.dir < 0);
    }
    if (e.flo) s.y = e.feet - 6 + Math.sin(this.t * 2 + s.x * 0.01) * 5;
    if (!this.dead && !this.done && !this.hidden && ovl(this.pr(), { l: s.x - e.hw, r: s.x + e.hw, t: e.feet - e.hh, b: e.feet + 2 })) this.die('shadow');
    return inten;
  }

  updateBeast(e, dt) {
    const s = e.s, P = this.player, d = e.def;
    if (!e.active) {
      if (!this.dead && !this.done && P.x > d.trigger && (!d.need || this.state[d.need])) {
        e.active = true; s.setVisible(true); s.x = Math.max(d.x, P.x - 560); s.play('beast_run');
        LBAudio.sfx('roar'); this.cameras.main.shake(700, 0.01);
      } else return 0;
    }
    if (this.done) { s.anims.stop(); return 0; }
    if (!e.stopped) {
      s.x += d.speed * dt;
      if (d.stopFront && s.x + 140 >= d.stopFront) {
        s.x = d.stopFront - 140; e.stopped = true; s.anims.stop(); s.setFrame(1);
        LBAudio.sfx('roar'); LBAudio.sfx('slam'); this.cameras.main.shake(600, 0.012);
      }
      e.thud -= dt;
      if (e.thud <= 0) { e.thud = 0.34; if (Math.abs(P.x - s.x) < 800) { LBAudio.sfx('thud'); this.cameras.main.shake(90, 0.003); } }
    }
    let hop = 0;
    (d.leaps || []).forEach(l => { if (s.x > l[0] && s.x < l[1]) hop = Math.sin((s.x - l[0]) / (l[1] - l[0]) * Math.PI) * 110; });
    s.y = GY + 2 - hop;
    if (!this.dead && ovl(this.pr(), { l: s.x - 90, r: s.x + 140, t: s.y - 130, b: s.y })) this.die('beast');
    return e.stopped ? 0 : (Math.abs(P.x - s.x) < 900 ? 1 : 0.4);
  }

  updateGuard(e, dt) {
    const s = e.s, d = e.def, P = this.player;
    this.btnTick(e);
    if (e.dead) return;
    const tilt = 0.27 + 0.08 * Math.sin(this.t * 1.7);
    const eyeX = s.x + e.dir * 9, eyeY = e.feet - e.eye;
    // sight test
    let sees = false;
    if (!this.hidden && !this.dead) {
      const vx = (P.x - eyeX) * e.dir, vy = (P.body.bottom - 22) - eyeY, dist = Math.hypot(vx, vy);
      if (vx > 0 && dist < d.range && Math.abs(Math.atan2(vy, vx) - tilt) < e.half) sees = true;
    }
    if (sees) {
      e.alert += dt;
      e.alarmT -= dt; if (e.alarmT <= 0) { LBAudio.sfx('alarm'); e.alarmT = 0.4; }
      if (e.alert >= d.alert && !this.dead) { LBAudio.sfx('zap'); this.die('zap', { x: eyeX, y: eyeY }); }
    } else e.alert = Math.max(0, e.alert - 1.4 * dt);
    // movement
    if (e.alert > 0.05) { s.anims.stop(); }
    else if (e.state === 'pause') { e.timer -= dt; if (e.timer <= 0) { e.state = 'patrol'; s.play(e.aw, true); } }
    else {
      s.x += e.dir * d.speed * dt;
      if (e.dir > 0 && s.x >= d.x2) { s.x = d.x2; e.dir = -1; e.state = 'pause'; e.timer = 1.4; s.anims.stop(); }
      else if (e.dir < 0 && s.x <= d.x1) { s.x = d.x1; e.dir = 1; e.state = 'pause'; e.timer = 1.4; s.anims.stop(); }
      else s.play(e.aw, true);
    }
    s.setFlipX(e.dir < 0);
    e.cone.setPosition(s.x + e.dir * 9, eyeY);
    e.cone.rotation = e.dir > 0 ? tilt : Math.PI - tilt;
    const k = Math.min(1, e.alert / d.alert);
    e.cone.setTint(k > 0.02 ? 0xff3a3a : 0xfff4d8).setAlpha(0.32 + 0.4 * k);
    if (!this.dead && !this.done && ovl(this.pr(), { l: s.x - e.hw, r: s.x + e.hw, t: e.feet - e.hh, b: e.feet + 2 })) this.die('shadow');
  }

  btnTick(e) {

    e.bt.setVisible(Math.abs(P.body.center.x - d.btn.x) < 95 && Math.abs(P.body.bottom - d.btn.y) < 130);
  }
  updateWatcher(e, dt) {
    const d = e.def, s = e.s, P = this.player;
    this.btnTick(e);
    if (e.dead) return;
    const cyc = d.closed + d.warn + d.open, ph = (this.t + d.off) % cyc;
    let phase = ph < d.closed ? 'closed' : (ph < d.closed + d.warn ? 'warn' : 'open');
    if (phase !== e.phase) {

  updateAtmosphere(dt) {
    if (this.hintObj) {
      const h = this.hintObj, cam = this.cameras.main, sx = h.x - cam.scrollX;
      if (this.t > h.until) { h.items.forEach(o => o.destroy()); this.hintObj = null; }
      else if (sx < 20 || sx > VW - 20) { h.edge.setText(sx < 0 ? '\u25C0' : '\u25B6').setX(sx < 0 ? 30 : (VW - 30) / (this.camZoom || 1)); } else h.edge.setText('');

    if (this.alarm) this.alarm.setAlpha(0.03 + 0.07 * (0.5 + 0.5 * Math.sin(this.t * 4)));
    const px = this.player.x;

  die(cause, from) {
    if (this.dead || this.done || this.invuln > 0) return;
    if (this.extra > 0) { this.extra--; this.revive(cause); return; }
    this.dead = true; LBAudio.sfx(cause === 'zap' ? 'zap' : 'death'); LBAudio.setIntensity(0);
    const p = this.player, cam = this.cameras.main;
    if (this.climbing) this.endClimb();
    p.body.setVelocity(0, 0); p.body.setAllowGravity(false); p.anims.stop(); p.setFrame(LBArt.FR.fall); p.setAlpha(1);
    if (from) { const g = this.add.graphics().setDepth(40); g.lineStyle(3, 0xff2020, 1); g.lineBetween(from.x, from.y, p.x, p.y - 24); this.tweens.add({ targets: g, alpha: 0, duration: 500 }); }
    cam.shake(300, 0.012);
    this.tweens.add({ targets: p, alpha: 0, angle: this.facing * 80, duration: 700 });
    this.time.delayedCall(850, () => cam.fadeOut(300, 0, 0, 0));
    this.time.delayedCall(1180, () => this.scene.restart({ level: this.lv, cp: this.cpIdx }));
  }

  updateHandIK(dt) {
    if (!this.handGfx) this.handGfx = this.add.graphics().setDepth(10.2);
    const g = this.handGfx;
    g.clear();
    if (this.dead || this.climbing || this.crouched) return;
    const p = this.player, b = p.body, dir = this.facing;
    const shX = p.x + dir * 2, shY = b.bottom - 31;
    let targetX = null, targetY = null;
    if (this.grab) {                                   // grabbing a crate: hands lock onto its side
      const ob = this.grab.body;
      targetX = dir > 0 ? ob.left + 1 : ob.right - 1; targetY = shY + 2;
    } else {                                           // approaching a wall/door: brace one hand against it
      for (const s of this.solidRects) {
        if (!s.solid) continue;
        if (shY > s.y + 4 && shY < s.y + s.h - 4) {
          const edge = dir > 0 ? s.x : s.x + s.w, dist = (edge - (dir > 0 ? b.right : b.left)) * dir;
          if (dist >= 0 && dist < 16) { targetX = edge; targetY = shY - 3; break; }
        }
      }
    }
    this.handBlend = approach(this.handBlend || 0, targetX !== null ? 1 : 0, 9 * dt);
    if (this.handBlend <= 0.05 || targetX === null) return;
    const pl = LBProfile.pal(), skin = (pl.skin && pl.skin[1]) || '#6e4533', sleeve = pl.shirt[1];
    const toN = c => Phaser.Display.Color.HexStringToColor(c).color;
    const hx = Phaser.Math.Linear(shX + dir * 6, targetX, this.handBlend), hy = Phaser.Math.Linear(shY + 8, targetY, this.handBlend);
    const mx = (shX + hx) * 0.5 - dir * 1.5, my = (shY + hy) * 0.5 + 4.5;
    g.lineStyle(3.4, toN(sleeve), 1); g.beginPath(); g.moveTo(shX, shY); g.lineTo(mx, my); g.strokePath();
    g.lineStyle(2.4, toN(skin), 1); g.beginPath(); g.moveTo(mx, my); g.lineTo(hx, hy); g.strokePath();
    g.fillStyle(toN(skin), 1); g.fillCircle(hx, hy, 1.9);
  }

  /* ---- online co-op (peer-to-peer ghost partner, shared switches/plates, both must reach the exit) ---- */
  initNet() {
    this.net = LBNet.connected; this.partner = null; this.pTarget = null; this.pExit = false; this.atExit = false; this.netT = 0; this.waitT = null;
    if (!this.net) return;
    this.partner = this.add.sprite(-200, 0, 'boy', 0).setOrigin(0.5, 1).setScale(LBArt.BS).setDepth(9.5).setAlpha(0.72).setTint(0x9ec4ff).setVisible(false);
    this.pLabel = this.add.text(0, 0, 'FRIEND', { fontFamily: FONT, fontSize: '12px', color: '#9ec4ff' }).setOrigin(0.5, 1).setDepth(9.6).setVisible(false);
    this.netH = m => this.onNet(m); LBNet.on(this.netH);
    this.events.once('shutdown', () => { LBNet.off(this.netH); });
    LBNet.onState = st => { if (st === 'closed') { this.net = false; this.partner.setVisible(false); this.pLabel.setVisible(false); const m = uiText(this, VW / 2, 92, 'Friend disconnected - playing solo', 20, '#ffcf8a', true).setOrigin(0.5).setDepth(200); this.time.delayedCall(3000, () => m.destroy()); } };
  }
  onNet(m) {
    if (!this.partner) return;
    if (m.t === 'p') {
      if (m.lv !== this.lv) { this.partner.setVisible(false); this.pLabel.setVisible(false); this.pTarget = null; return; }
      if (!this.pTarget) this.partner.setPosition(m.x, m.y);
      this.pTarget = m; this.partner.setFrame(m.f | 0).setFlipX(!!m.fl).setVisible(true); this.pLabel.setVisible(true);
      if (m.bx) { const s = this.boxes.getChildren()[m.bx.i]; if (s && s !== this.grab) s.body.reset(m.bx.x, m.bx.y); }
    } else if (m.t === 'st') {
      const w = this.enemies.find(q => q.id === m.id); if (w) { this.killWatcher(w, true); return; }
      if (this.state[m.id] !== m.v) { this.state[m.id] = m.v; const l = this.levers.find(q => q.id === m.id); if (l) l.spr.setFrame(m.v ? 1 : 0); LBAudio.sfx('lever'); }
    } else if (m.t === 'ex') { this.pExit = !!m.v; }
  }
  updateNet(dt) {
    if (!this.net || !LBNet.connected) return;
    const p = this.player;
    this.netT -= dt;
    if (this.netT <= 0) {
      this.netT = 0.066;
      const bi = this.grab ? this.boxes.getChildren().indexOf(this.grab) : -1;
      LBNet.send({ t: 'p', lv: this.lv, x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10, f: +p.frame.name, fl: p.flipX, bx: bi >= 0 ? { i: bi, x: Math.round(this.grab.x), y: Math.round(this.grab.y) } : null });
    }
    if (this.pTarget) {
      const t = this.pTarget, k = Math.min(1, 14 * dt);
      this.partner.x += (t.x - this.partner.x) * k; this.partner.y += (t.y - this.partner.y) * k;
      this.pLabel.setPosition(this.partner.x, this.partner.y - 70);
    }
  }
  checkExit(inEx) {
    if (!this.net || !LBNet.connected) { if (inEx) this.finish(); return; }
    if (inEx !== this.atExit) { this.atExit = inEx; LBNet.send({ t: 'ex', v: inEx }); }
    if (this.atExit && this.pExit) { this.finish(); return; }
    if (this.atExit && !this.waitT) this.waitT = uiText(this, VW / 2, 92, 'WAITING FOR YOUR FRIEND...', 22, '#9ec4ff', true).setOrigin(0.5).setDepth(200);

  }
  camFollow(dt) {

  revive(cause) {                                            // Guardian skin: survive the first deadly hit

  /* ---- hint (lightbulb): costs 1 hint; hints are earned by watching up to 3 ads a day ---- */
  hint() {
    if (this.dead || this.done || this.paused || this.hintDlg) return;
    if (!LBProfile.hints()) { this.offerAd(); return; }
    this.showHint(true);
  }
  showHint(spend) {
    if (spend && !LBProfile.useHint()) return;
    refreshHintBadge();
    const L = this.L, px = this.player.x, c = [];
    (L.levers || []).forEach(l => { if (!this.state[l.id]) c.push({ x: l.x, y: l.y - 34, t: 'Pull this lever  (E)' }); });
    (L.plates || []).forEach(p => { if (!this.state[p.id]) c.push({ x: p.x + p.w / 2, y: GY - 24, t: 'Weigh this plate down with a crate' }); });
    (L.boxes || []).forEach(b => { if (b.x > px - 40 && b.x < px + 600) c.push({ x: b.x, y: b.y - 66, t: 'Push this crate  (hold E)' }); });
    let best = null;
    c.forEach(o => { if (o.x > px - 120 && (!best || o.x < best.x)) best = o; });
    if (!best) best = { x: L.exit.x + L.exit.w / 2, y: L.exit.y - 10, t: 'Keep going - the way out is this way' };
    if (this.hintObj) { this.hintObj.items.forEach(o => o.destroy()); }
    const arrow = uiText(this, best.x, best.y, '\u25BC', 34, '#ffe08a').setOrigin(0.5).setDepth(60);
    const glow = this.add.image(best.x, best.y + 20, 'glow').setBlendMode(Phaser.BlendModes.ADD).setTint(0xffe08a).setScale(1.6).setDepth(59);
    const lbl = uiText(this, VW / 2, 92, 'HINT: ' + best.t, 22, '#ffe9a0', true).setOrigin(0.5).setDepth(200);
    const edge = uiText(this, 0, VH / 2, '', 30, '#ffe08a', true).setOrigin(0.5).setDepth(200);
    this.tweens.add({ targets: [arrow], y: best.y - 12, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.hintObj = { items: [arrow, glow, lbl, edge], x: best.x, edge: edge, until: this.t + 8 };
  }
  offerAd() {
    const left = LBProfile.adsLeft();
    if (left <= 0) { const m = uiText(this, VW / 2, 92, 'No hints left. Free ads reset tomorrow (3 per day).', 20, '#ffcf8a', true).setOrigin(0.5).setDepth(200); this.time.delayedCall(2600, () => m.destroy()); return; }
    this.togglePause();
    const d = this.hintDlg = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0.8);color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;font:20px sans-serif;text-align:center;gap:14px';
    d.innerHTML = '<div style="font-size:26px">Out of hints</div><div>Watch a short ad to get 1 hint<br>(' + left + ' of 3 free ads left today)</div>' +
      '<div style="display:flex;gap:14px"><button id="hAd" style="font-size:20px;padding:12px 22px">WATCH AD</button><button id="hNo" style="font-size:20px;padding:12px 22px">CLOSE</button></div>';
    document.body.appendChild(d);
    const close = () => { d.remove(); this.hintDlg = null; if (this.paused) this.togglePause(); };
    d.querySelector('#hNo').onclick = close;
    d.querySelector('#hAd').onclick = () => {
      d.remove();
      LBAds.showRewarded(ok => {
        this.hintDlg = null; if (this.paused) this.togglePause();
        if (ok && LBProfile.grantAdHint()) { refreshHintBadge(); this.showHint(true); }
      });
    };
  }
  retry() { if (this.done) return; this.scene.restart({ level: this.lv, cp: this.cpIdx }); }

  finish() {
    if (this.done) return;
    this.done = true; LBAudio.sfx('win'); LBAudio.setIntensity(0);
    LBProfile.addCoins(this.L.exit.final ? 100 : 40);
    uiText(this, VW / 2, 120, '+' + (this.L.exit.final ? 100 : 40) + ' COINS', 30, '#e8c860', true).setOrigin(0.5).setDepth(450);
    const cam = this.cameras.main, final = this.L.exit.final;
    this.vx = 0;
    this.player.body.setAllowGravity(true);
    LBSave.set(final ? 0 : this.lv + 1);
    if (final) {
      cam.flash(1200, 255, 255, 255);
      this.time.delayedCall(2200, () => cam.fadeOut(1500, 255, 255, 255));
      this.time.delayedCall(3800, () => this.scene.start('End'));
    } else {
      this.time.delayedCall(900, () => cam.fadeOut(1000, 0, 0, 0));
      this.time.delayedCall(2000, () => this.scene.start('Game', { level: this.lv + 1, first: true }));
    }
  }

  /* ------------------------------ pause ------------------------------ */
  togglePause() {
    if (this.done || this.dead) return;
    this.paused = !this.paused;
    if (this.paused) {
      this.physics.world.pause(); this.anims.pauseAll(); this.tweens.pauseAll(); this.time.paused = true; LBAudio.setIntensity(0);
      const o = this.pauseObjs, add = (x) => { x.setScrollFactor(0).setDepth(500); o.push(x); return x; };
      add(this.add.rectangle(0, 0, VW, VH, 0x000000, 0.78).setOrigin(0));
      add(this.add.text(VW / 2, 120, 'PAUSED', { fontFamily: TITLE_FONT, fontSize: '64px', color: '#e8e8e8', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5));
      const items = [
        ['RESUME', () => this.togglePause()],
        ['RESTART LEVEL', () => { this.togglePause(); this.scene.restart({ level: this.lv, first: false }); }],
        ['GRAPHICS: ' + ['LOW', 'MEDIUM', 'HIGH'][LBFX.getQuality()], () => { LBFX.setQuality((LBFX.getQuality() + 1) % 3); this.togglePause(); this.scene.restart({ level: this.lv, cp: this.cpIdx }); }],
        ['SOUND: ' + (LBAudio.isMuted() ? 'OFF' : 'ON'), () => { LBAudio.setMuted(!LBAudio.isMuted()); LBAudio.init(); this.togglePause(); this.togglePause(); }],
        ['MAIN MENU', () => { this.togglePause(); this.cameras.main.fadeOut(400, 0, 0, 0); this.time.delayedCall(420, () => this.scene.start('Menu')); }]
      ];
      items.forEach((it, i) => {
        const b = uiButton(this, VW / 2, 215 + i * 62, it[0], 30, it[1], true).setOrigin(0.5); add(b);
      });
    } else {
      this.physics.world.resume(); this.anims.resumeAll(); this.tweens.resumeAll(); this.time.paused = false;
      this.pauseObjs.forEach(x => x.destroy()); this.pauseObjs = [];
    }
  }
}

/* ===================================================================== */
class StoreScene extends Phaser.Scene {
  constructor() { super('Store'); }
  create() {
    LBRes.cam(this); LBUI.hud(false); LBInput.clearEdges();
    this.cameras.main.setBackgroundColor('#0b0c0e');
    this.add.image(0, 0, 'sky_forest').setOrigin(0).setDisplaySize(VW, VH).setAlpha(0.35);
    this.add.image(0, 0, 'vig').setOrigin(0).setDepth(50);
    uiText(this, 40, 18, 'STORE', 40, '#ececec').setFontFamily(TITLE_FONT);
    this.coinT = uiText(this, 40, 70, '', 22, '#e8c860'); this.hintT = uiText(this, 220, 70, '', 22, '#ffe9a0');
    this.msg = uiText(this, VW / 2, 500, '', 18, '#bbbbbb').setOrigin(0.5).setDepth(60);
    uiButton(this, 800, 14, '< BACK', 24, () => this.scene.start('Menu')).setDepth(60);
    this.cards = [];
    LBSkinOrder.forEach((k, i) => {
      const x = 14 + i * 117, y = 118, s = LBSkins[k];
      const box = this.add.rectangle(x, y, 111, 360, 0x14161a, 0.92).setOrigin(0).setStrokeStyle(2, 0x3a4047);
      const pk = LBArt.makePreview(this, k);
      this.add.image(x + 55, y + 142, pk).setScale(0.85).setOrigin(0.5, 1);
      uiText(this, x + 55, y + 154, s.name, 16, '#ececec').setOrigin(0.5, 0);
      const ab = this.add.text(x + 55, y + 182, s.ab, { fontFamily: FONT, fontSize: '12px', color: '#b8c4d0', align: 'center', wordWrap: { width: 100 } }).setOrigin(0.5, 0);
      const btn = uiButton(this, x + 55, y + 300, '', 15, () => this.press(k)).setOrigin(0.5, 0);
      this.cards.push({ k: k, box: box, btn: btn });
    });
    this.refresh();
    this.cameras.main.fadeIn(300, 0, 0, 0);
  }
  refresh() {
    this.coinT.setText('COINS  ' + LBProfile.coins()); this.hintT.setText('');
    this.cards.forEach(c => {
      const own = LBProfile.owns(c.k), eq = LBProfile.skin() === c.k;
      c.btn.setText(eq ? 'EQUIPPED' : own ? 'EQUIP' : 'BUY  ' + LBSkins[c.k].price);
      c.box.setStrokeStyle(2, eq ? 0xc4161c : 0x3a4047);
    });
  }
  press(k) {
    if (LBProfile.owns(k)) { if (LBProfile.equip(k)) { LBArt.applySkin(this); this.msg.setText(LBSkins[k].name + ' equipped'); this.scene.restart(); } return; }
    if (LBProfile.buy(k)) { LBArt.applySkin(this); this.scene.restart(); }
    else this.msg.setText('Not enough coins. Finish chapters to earn 40 coins each (100 for the last).');
  }
}

/* ===================================================================== */
class EndScene extends Phaser.Scene {
  constructor() { super('End'); }
  create() {
    LBRes.cam(this); LBUI.hud(false); LBAudio.music(-1);
    this.cameras.main.setBackgroundColor('#000000');
    this.cameras.main.fadeIn(1500, 255, 255, 255);
    this.add.image(VW - 120, 300, 'glow').setBlendMode(Phaser.BlendModes.ADD).setScale(6).setAlpha(0.9);
    this.add.rectangle(0, 452, VW, 100, 0x030303).setOrigin(0);
    const b = this.add.sprite(120, 454, 'boy', 0).setOrigin(0.5, 1).setScale(1.7 * LBArt.BS); b.play('boy_walk');
    const g = this.add.sprite(60, 454, 'girl', 0).setOrigin(0.5, 1).setScale(1.7); g.play('girl_walk');
    this.tweens.add({ targets: [b, g], x: '+=620', duration: 9000, ease: 'Sine.easeOut', onComplete: () => { b.anims.stop(); b.setFrame(0); g.anims.stop(); g.setFrame(0); } });
    this.add.text(VW / 2, 120, 'THE END', { fontFamily: TITLE_FONT, fontSize: '80px', color: '#ececec', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5);
    this.add.text(VW / 2, 190, 'He was never lost. He was looking for her.\nThank you for playing.', { fontFamily: FONT, fontSize: '20px', color: '#cfcfcf', align: 'center', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);
    uiButton(this, VW / 2, 480, 'MAIN MENU', 28, () => this.scene.start('Menu')).setOrigin(0.5);
  }
}

/* ===================================================================== */
window.addEventListener('load', function () {
  LBUI.game = new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', backgroundColor: '#000000',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: VW * LBRes.R, height: VH * LBRes.R },
    physics: { default: 'arcade', arcade: { gravity: { y: 1400 }, fps: 60, debug: false } },
    render: { antialias: true, powerPreference: 'high-performance' },
    input: { activePointers: 3 },
    scene: [BootScene, MenuScene, StoreScene, GameScene, EndScene]
  });
});

}
